# Servidor web del frontend (SPEC-11 §4.2 y §6.1, plan §4.2).
# Plantilla: la imagen oficial de nginx reemplaza ${API_UPSTREAM} al arrancar.

# IP real del usuario: Cloudflare la manda en CF-Connecting-IP. Se usa ésa y no
# la X-Forwarded-For que venga del cliente (EC-P03); sin Cloudflare (desarrollo),
# la del que se conecta.
map $http_cf_connecting_ip $ip_cliente {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Foto de perfil (2 MB) y PDF de aval (10 MB), con margen (ARCHIVO_*_MAX_MB).
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API en el mismo origen (D-02).
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $ip_cliente;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ~ ^/health(/db)?$ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $ip_cliente;
    }

    # Archivos con hash en el nombre: caché larga.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html siempre fresco, para que una versión nueva se vea al recargar.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Navegación con hash (/#/…): no hace falta reescribir rutas.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
